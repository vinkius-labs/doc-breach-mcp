          "description": "[INSTRUCTIONS] Use this as the FIRST step when you need to find documentation. Use specific, descriptive queries. Example: \"stripe API webhooks\" instead of just \"stripe\". Combine your search intents into a single query. Do NOT call this tool in rapid loops — refine your query instead.\n\nFind documentation sources for any service, library, or API. Select operation via the `action` parameter. Actions: discover, extract, read, search\n\nWorkflow:\n- 'discover': [INSTRUCTIONS] Use this as the FIRST step when you need to find documentation. Use specific, descriptive queries. Example: \"stripe API webhooks\" instead of just \"stripe\". Combine your search intents into a single query. Do NOT call this tool in rapid loops — refine your query instead.\n\nFind documentation sources for any service, library, or API. Requires: query\n- 'extract': [INSTRUCTIONS] Use this ONLY when docs.read has identified an OpenAPI/Swagger spec URL or Postman Collection. Provide a tag to filter endpoints by API group. If no tag is provided, returns a summary of all tags with endpoint counts.\n\nExtract structured endpoint information from an OpenAPI, Swagger, or Postman spec. Requires: url\n- 'read': [INSTRUCTIONS] Reads a documentation page and returns clean Markdown. Handles HTML, JSON, YAML, OpenAPI specs, Postman Collections, PDFs (<5MB), and llms.txt. The response includes a \"Related Documentation Links\" section extracted from page navigation. ALWAYS check these links for authentication and getting-started pages before generating code.\n\nRead any documentation URL and return clean, LLM-ready Markdown. Requires: url\n- 'search': [INSTRUCTIONS] Use this when you ALREADY know the documentation domain and need to find a specific page. Always provide the \"site\" parameter when searching within a known domain. Example: docs.search({ query: \"authentication headers\", site: \"docs.stripe.com\" })\n\nSearch for specific topics within a documentation site. Requires: query",
